name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:../data/skillforge.db
    steps:
      - uses: actions/checkout@v4
      # corepack must come first: setup-node's `cache: pnpm` shells out to
      # `pnpm store path`, which fails if pnpm is not on PATH yet.
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The C# exercises are compiled and executed by validate:content and the
      # runner unit tests, so the SDK has to be here before either runs.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: corepack pnpm install --frozen-lockfile
      - run: mkdir -p data
      - run: corepack pnpm run db:setup
      - run: corepack pnpm run csharp:build
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: corepack pnpm run runtime:prepare
      - run: corepack pnpm run lint
      - run: corepack pnpm run typecheck
      - run: corepack pnpm run validate:content
      - run: node scripts/check-content-quality.mjs
      - run: corepack pnpm test
      - run: corepack pnpm run test:db
      - run: corepack pnpm run test:e2e
      - run: dotnet test projects/inventory-desk/InventoryDesk.sln
      - run: node scripts/verify-companion-backup.mjs
      - run: node projects/inventory-desk/scripts/test-browser.mjs
      - run: corepack pnpm run build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: |
            test-results
            playwright-report
            projects/inventory-desk/test-results
            projects/inventory-desk/playwright-report
